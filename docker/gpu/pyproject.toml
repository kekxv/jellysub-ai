[project]
name = "jellysub-ai-gpu"
version = "0.1.0"
description = "Locked CUDA dependencies for the JellySub AI GPU image"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "modelscope>=1.36.2",
    "openai>=1.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "sentencepiece>=0.2.0",
    "qwen-asr>=0.0.1",
    "funasr>=1.0",
    "python-dotenv>=1.0",
    "pyotp>=2.9",
    "silero-vad>=5.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
